[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mufinder"
version = "0.1.0"
description = "MuFinder scientific desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7",
  "ase>=3.23",
  "matplotlib>=3.8",
  "scipy>=1.12",
  "spglib>=2.5",
  "paramiko>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "Sphinx>=8.0",
  "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/BenHuddart/mufinder"
Documentation = "https://benhuddart.github.io/mufinder/"
Repository = "https://github.com/BenHuddart/mufinder"
Releases = "https://github.com/BenHuddart/mufinder/releases"

[project.scripts]
mufinder = "mufinder.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mufinder.assets" = ["*.png", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mufinder --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["mufinder"]

[tool.coverage.report]
show_missing = true
skip_covered = false

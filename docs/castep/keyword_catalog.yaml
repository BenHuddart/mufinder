version: 0.1
notes:
  - This is a conservative starter catalog for the keywords implemented in `mufinder.castep_io`.
  - Local CASTEP evidence came primarily from `Doc/cell.tex` and a locally installed `Test/Utilities/ReadTS/castep_keywords.json` in the CASTEP source tree.
  - Do not vendor or commit `castep_keywords.json` or generated copies of it into this repository.
  - If support is unclear, extend this catalog conservatively and avoid inventing syntax.
  - Optional `gui` metadata is used to drive workflow-aware parameter presentation in the PySide UI.
  - The electronic minimiser keyword `ELEC_METHOD` is not implemented; the GdRu2Si2 worked example's real inputs set it to `EDFT`.

keywords:
  - name: LATTICE_CART
    canonical_name: lattice_cart
    file: cell
    kind: block
    value_type: lattice_cart_block
    unit: ang
    allowed_values: []
    mutually_exclusive_with: [LATTICE_ABC]
    requires: []
    example: |
      %BLOCK LATTICE_CART
      ang
      5.43 0 0
      0 5.43 0
      0 0 5.43
      %ENDBLOCK LATTICE_CART
    notes: Optional first line stores the lattice unit. Implemented as a typed block with three 3-vectors, but MuFinder treats this as structure-controlled and does not expose it in parameter dialogs.

  - name: LATTICE_ABC
    canonical_name: lattice_abc
    file: cell
    kind: block
    value_type: lattice_abc_block
    unit: ang
    allowed_values: []
    mutually_exclusive_with: [LATTICE_CART]
    requires: []
    example: |
      %BLOCK LATTICE_ABC
      ang
      5.43 5.43 5.43
      90 90 90
      %ENDBLOCK LATTICE_ABC
    notes: Angles are expressed in degrees. MuFinder treats this as structure-controlled and does not expose it in parameter dialogs.

  - name: POSITIONS_FRAC
    canonical_name: positions_frac
    file: cell
    kind: block
    value_type: positions_block
    unit:
    allowed_values: []
    mutually_exclusive_with: [POSITIONS_ABS]
    requires: [LATTICE_CART or LATTICE_ABC]
    example: |
      %BLOCK POSITIONS_FRAC
      Fe 0 0 0 SPIN=2
      Fe 0.5 0.5 0.5 SPIN=-2
      %ENDBLOCK POSITIONS_FRAC
    notes: CASTEP accepts species labels or atomic numbers; MuFinder stores them as strings. For spin-polarized jobs, MuFinder can append inline `SPIN=<value>` tokens on `POSITIONS_FRAC` rows using per-atom spins in units of hbar/2. MuFinder treats this as structure-controlled and does not expose it in parameter dialogs.

  - name: POSITIONS_ABS
    canonical_name: positions_abs
    file: cell
    kind: block
    value_type: positions_block
    unit: ang
    allowed_values: []
    mutually_exclusive_with: [POSITIONS_FRAC]
    requires: [LATTICE_CART or LATTICE_ABC]
    example: |
      %BLOCK POSITIONS_ABS
      ang
      Si 0 0 0
      %ENDBLOCK POSITIONS_ABS
    notes: Optional first line stores the Cartesian unit. MuFinder treats this as structure-controlled and does not expose it in parameter dialogs.

  - name: POSITIONS_FRAC_PRODUCT
    canonical_name: positions_frac_product
    file: cell
    kind: block
    value_type: positions_block
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: |
      %BLOCK POSITIONS_FRAC_PRODUCT
      Fe 0 0 0 SPIN=2
      Fe 0.5 0.5 0.5 SPIN=-2
      %ENDBLOCK POSITIONS_FRAC_PRODUCT
    notes: Product-state fractional positions for CASTEP transition-state searches. MuFinder generates this from the selected product relaxed structure and does not expose it in parameter dialogs.

  - name: POSITIONS_FRAC_INTERMEDIATE
    canonical_name: positions_frac_intermediate
    file: cell
    kind: block
    value_type: positions_block
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: |
      %BLOCK POSITIONS_FRAC_INTERMEDIATE
      Fe 0 0 0 SPIN=2
      Fe 0.25 0.5 0.5 SPIN=-2
      %ENDBLOCK POSITIONS_FRAC_INTERMEDIATE
    notes: Intermediate-image fractional positions for CASTEP NEB transition-state searches. MuFinder generates this as the IDPP-seeded central image between the two relaxed endpoints and does not expose it in parameter dialogs.

  - name: POSITIONS_ABS_PRODUCT
    canonical_name: positions_abs_product
    file: cell
    kind: block
    value_type: positions_block
    unit: ang
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: |
      %BLOCK POSITIONS_ABS_PRODUCT
      ang
      Fe 0 0 0 SPIN=2
      Fe 2.5 2.5 2.5 SPIN=-2
      %ENDBLOCK POSITIONS_ABS_PRODUCT
    notes: Product-state Cartesian positions for CASTEP transition-state searches. MuFinder does not generate this block; NEB jobs use POSITIONS_FRAC_PRODUCT, because CASTEP rejects tagged species such as the muon in the Cartesian form.

  - name: POSITIONS_ABS_INTERMEDIATE
    canonical_name: positions_abs_intermediate
    file: cell
    kind: block
    value_type: positions_block
    unit: ang
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: |
      %BLOCK POSITIONS_ABS_INTERMEDIATE
      ang
      Fe 0 0 0 SPIN=2
      Fe 1.25 2.5 2.5 SPIN=-2
      %ENDBLOCK POSITIONS_ABS_INTERMEDIATE
    notes: Intermediate Cartesian positions for CASTEP transition-state searches. MuFinder does not generate this block; NEB jobs use POSITIONS_FRAC_INTERMEDIATE, because CASTEP rejects tagged species such as the muon in the Cartesian form.

  - name: SPECIES_POT
    canonical_name: species_pot
    file: cell
    kind: block
    value_type: species_pot_block
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: |
      %BLOCK SPECIES_POT
      Si Si_00.recpot
      %ENDBLOCK SPECIES_POT
    notes: Each row pairs one species with one pseudopotential.

  - name: SPECIES_MASS
    canonical_name: species_mass
    file: cell
    kind: block
    value_type: species_mass_block
    unit: AMU
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: |
      %BLOCK SPECIES_MASS
      AMU
      H:mu 0.1134
      %ENDBLOCK SPECIES_MASS
    notes: Each row assigns a mass to a species label; an optional first line gives the mass unit (AMU). Muon relaxation and Quantum Corrections set the mass of the muon species H:mu to the CODATA muon mass.

  - name: HUBBARD_U
    canonical_name: hubbard_u
    file: cell
    kind: block
    value_type: hubbard_u_block
    unit: eV
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: |
      %BLOCK HUBBARD_U
      eV
      Sm f: 6.1
      Ni d: 2.4
      U d: 1.2
      U f: 2.1
      %ENDBLOCK HUBBARD_U
    notes: An optional first line gives the unit, eV or Ha. The editor writes one row per species and orbital, with an `s:`, `p:`, `d:` or `f:` value that applies to every atom of that species.
    gui:
      label: Hubbard U
      category: electronic
      widget_hint: hubbard_u
      advanced_workflows: [convergence_cutoff, convergence_kpoint, pristine_relaxation, uep, muon_generation, muon_relaxation, site_analysis, magnetic_field, quantum_corrections, energy_barriers]

  - name: KPOINTS_LIST
    canonical_name: kpoints_list
    file: cell
    kind: block
    value_type: kpoints_list_block
    unit:
    allowed_values: []
    mutually_exclusive_with: [KPOINT_MP_GRID, KPOINT_MP_SPACING]
    requires: []
    example: |
      %BLOCK KPOINTS_LIST
      0.25 0.25 0.25 0.25
      0.25 -0.25 0.25 0.25
      0.25 0.25 -0.25 0.25
      0.25 -0.25 -0.25 0.25
      %ENDBLOCK KPOINTS_LIST
    notes: Weights must sum to 1.0.

  - name: KPOINT_MP_GRID
    canonical_name: kpoint_mp_grid
    file: cell
    kind: scalar
    value_type: int_triplet
    unit:
    allowed_values: []
    mutually_exclusive_with: [KPOINTS_LIST, KPOINT_MP_SPACING]
    locked_in_workflows: [convergence_kpoint]
    requires: []
    example: KPOINT_MP_GRID 4 4 4
    notes: Alias spellings such as `KPOINTS_MP_GRID` are read as this keyword.
    gui:
      label: K-Point MP Grid
      category: kpoints
      widget_hint: int_triplet
      default_value: [4, 4, 4]
      basic_workflows: [convergence_kpoint]
      advanced_workflows: [convergence_cutoff, muon_relaxation, uep]

  - name: PHONON_KPOINT_MP_GRID
    canonical_name: phonon_kpoint_mp_grid
    file: cell
    kind: scalar
    value_type: int_triplet
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: PHONON_KPOINT_MP_GRID 1 1 1
    notes: Monkhorst-Pack grid for phonon q-point sampling. Alias spellings such as `PHONON_KPOINTS_MP_GRID` are read as this keyword.

  - name: KPOINT_MP_SPACING
    canonical_name: kpoint_mp_spacing
    file: cell
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: 1/ang
    allowed_values: []
    mutually_exclusive_with: [KPOINTS_LIST, KPOINT_MP_GRID]
    requires: []
    example: KPOINT_MP_SPACING 0.05 1/ang
    notes: A unit given with the value is kept in the written input.
    gui:
      label: K-Point MP Spacing
      category: kpoints
      widget_hint: unit_float
      default_value: 0.05
      advanced_workflows: [convergence_cutoff, muon_relaxation, uep]

  - name: SYMMETRY_GENERATE
    canonical_name: symmetry_generate
    file: cell
    kind: scalar
    value_type: flag
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: SYMMETRY_GENERATE
    notes: Takes no value; the keyword is either present or absent.
    gui:
      label: Generate Symmetry
      category: structure
      widget_hint: flag
      default_value: true
      basic_workflows: [convergence_cutoff, convergence_kpoint]
      advanced_workflows: [convergence_cutoff, convergence_kpoint, muon_relaxation, uep]

  - name: FIX_ALL_CELL
    canonical_name: fix_all_cell
    file: cell
    kind: scalar
    value_type: bool
    unit:
    allowed_values: [TRUE, FALSE]
    mutually_exclusive_with: []
    requires: []
    example: FIX_ALL_CELL : TRUE
    notes: Keep unit-cell vectors fixed during geometry optimization when TRUE.
    gui:
      label: Fix All Cell
      category: constraints
      widget_hint: checkbox
      default_value: false
      basic_workflows: [pristine_relaxation]

  - name: FIX_COM
    canonical_name: fix_com
    file: cell
    kind: scalar
    value_type: bool
    unit:
    allowed_values: [TRUE, FALSE]
    mutually_exclusive_with: []
    requires: []
    example: 'FIX_COM : FALSE'
    notes: Fix the centre of mass during geometry optimization when TRUE. Energy-barrier workflows emit FALSE so the centre of mass stays free.

  - name: UNIT_CELL
    canonical_name: unit_cell
    file: cell
    kind: scalar
    value_type: text
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: UNIT_CELL 0.0 0.0 0.0
    notes: Opaque text-valued cell keyword retained for parser compatibility.

  - name: WRITE_CELL_STRUCTURE
    canonical_name: write_cell_structure
    file: param
    kind: scalar
    value_type: bool
    unit:
    allowed_values: [TRUE, FALSE]
    mutually_exclusive_with: []
    requires: []
    example: WRITE_CELL_STRUCTURE : TRUE
    notes: Must be TRUE for pristine relaxed-cell workflows to guarantee CASTEP writes `-out.cell`.
    gui:
      label: Write Cell Structure
      category: io
      widget_hint: checkbox
      default_value: false
      advanced_workflows: [convergence_cutoff, convergence_kpoint, pristine_relaxation, muon_relaxation]

  - name: WRITE_FORMATTED_DENSITY
    canonical_name: write_formatted_density
    file: param
    kind: scalar
    value_type: bool
    unit:
    allowed_values: [TRUE, FALSE]
    mutually_exclusive_with: []
    requires: []
    example: WRITE_FORMATTED_DENSITY : TRUE
    notes: Must be TRUE for UEP source jobs so CASTEP writes the `.den_fmt` density required for analysis.
    gui:
      label: Write Formatted Density
      category: io
      widget_hint: checkbox
      default_value: false
      basic_workflows: [uep]
      advanced_workflows: [convergence_cutoff, convergence_kpoint, pristine_relaxation, uep, muon_relaxation]
      locked_in_workflows: [uep]

  - name: CALCULATE_STRESS
    canonical_name: calculate_stress
    file: param
    kind: scalar
    value_type: bool
    unit:
    allowed_values: [TRUE, FALSE]
    mutually_exclusive_with: []
    requires: []
    example: CALCULATE_STRESS : TRUE
    notes: Compute the stress tensor at each SCF step. Required to feed max stress into cutoff and k-point convergence analysis.
    gui:
      label: Calculate Stress
      category: electronic
      widget_hint: flag
      default_value: false
      basic_workflows: [convergence_cutoff, convergence_kpoint]
      advanced_workflows: [convergence_cutoff, convergence_kpoint, pristine_relaxation, uep, muon_relaxation]

  - name: CHARGE
    canonical_name: charge
    file: param
    kind: scalar
    value_type: int
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: CHARGE : +1
    notes: Total system charge. Muon relaxation locks this to +1 for positive muon and 0 for muonium.
    gui:
      label: Charge
      category: electronic
      widget_hint: spinbox_int
      default_value: 0
      advanced_workflows: [muon_relaxation]

  - name: CONTINUATION
    canonical_name: continuation
    file: param
    kind: scalar
    value_type: text
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: CONTINUATION : DEFAULT
    notes: Free-text continuation source for resuming an earlier CASTEP run; CASTEP itself resumes from a matching seed.check file placed in the run directory. MuFinder's relaxation workflows always emit CONTINUATION : DEFAULT so a preserved run directory warm-starts automatically.
    gui:
      label: Continuation
      category: io
      widget_hint: text
      basic_workflows: [convergence_cutoff]
      advanced_workflows: [all]

  - name: TASK
    canonical_name: task
    file: param
    kind: scalar
    value_type: enum
    unit:
    allowed_values:
      - SINGLEPOINT
      - BANDSTRUCTURE
      - GEOMETRYOPTIMIZATION
      - MOLECULARDYNAMICS
      - OPTICS
      - TRANSITIONSTATESEARCH
      - PHONON
      - EFIELD
      - PHONON+EFIELD
      - THERMODYNAMICS
      - WANNIER
      - MAGRES
      - ELNES
      - SPECTRAL
      - EPCOUPLING
      - GENETICALGOR
    mutually_exclusive_with: []
    requires: []
    example: TASK : SINGLEPOINT
    notes: The values offered are taken from CASTEP's keyword metadata.
    gui:
      label: Task
      category: workflow
      widget_hint: dropdown
      default_value: SINGLEPOINT
      basic_workflows: [convergence_cutoff, convergence_kpoint, muon_relaxation]

  - name: MAGRES_TASK
    canonical_name: magres_task
    file: param
    kind: scalar
    value_type: enum
    unit:
    allowed_values:
      - HYPERFINE
    mutually_exclusive_with: []
    requires: [TASK=MAGRES]
    example: MAGRES_TASK : HYPERFINE
    notes: CASTEP accepts SHIELDING, EFG, NMR, GTENSOR, HYPERFINE, EPR and JCOUPLING (CASTEP 26.11 keyword metadata). MuFinder implements HYPERFINE only; the Hyperfine Coupling workflow sets it together with TASK=MAGRES and SPIN_POLARIZED, so it is not offered in any parameter dialog. CASTEP stops a hyperfine run that is not spin polarised or uses non-collinear spins.

  - name: XC_FUNCTIONAL
    canonical_name: xc_functional
    file: param
    kind: scalar
    value_type: enum
    unit:
    allowed_values:
      - LDA
      - PW91
      - PBE
      - B86BPBE
      - PBESOL
      - RPBE
      - WC
      - BLYP
      - LDA-C
      - LDA-X
      - ZERO
      - HF
      - PBE0
      - B3LYP
      - HSE03
      - HSE06
      - EXX-X
      - HF-LDA
      - EXX
      - EXX-LDA
      - SHF
      - SX
      - SHF-LDA
      - SX-LDA
      - WDA
      - SEX
      - SEX-LDA
      - RSCAN
    mutually_exclusive_with: []
    requires: []
    example: XC_FUNCTIONAL : PBE
    notes: CASTEP also accepts libXC functionals; with the built-in keyword set, MuFinder accepts only the values listed here.
    gui:
      label: XC Functional
      category: electronic
      widget_hint: dropdown
      default_value: LDA

  - name: TSSEARCH_METHOD
    canonical_name: tssearch_method
    file: param
    kind: scalar
    value_type: enum
    unit:
    allowed_values:
      - LSTQST
      - NEB
    mutually_exclusive_with: []
    requires: []
    example: TSSEARCH_METHOD : LSTQST
    notes: Transition-state search method used by MuFinder Energy Barriers jobs. The values offered are taken from CASTEP's keyword metadata.
    gui:
      label: TS Search Method
      category: workflow
      widget_hint: dropdown
      basic_workflows: [energy_barriers]
      advanced_workflows: [energy_barriers]

  - name: BASIS_PRECISION
    canonical_name: basis_precision
    file: param
    kind: scalar
    value_type: enum
    unit:
    allowed_values: [NULL, COARSE, MEDIUM, FINE, PRECISE, EXTREME]
    mutually_exclusive_with: [CUT_OFF_ENERGY]
    requires: []
    example: BASIS_PRECISION : FINE
    notes: `CUT_OFF_ENERGY` may still be supplied and overrides it.
    gui:
      label: Basis Precision
      category: electronic
      widget_hint: dropdown
      default_value: FINE
      advanced_workflows: [convergence_cutoff, convergence_kpoint, muon_relaxation]

  - name: CUT_OFF_ENERGY
    canonical_name: cut_off_energy
    file: param
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: eV
    allowed_values: []
    mutually_exclusive_with: [BASIS_PRECISION]
    locked_in_workflows: [convergence_cutoff]
    requires: []
    example: CUT_OFF_ENERGY : 340 eV
    notes: Overrides `BASIS_PRECISION` when both are set.
    gui:
      label: Cutoff Energy
      category: electronic
      widget_hint: unit_float
      default_value: 340.0
      basic_workflows: [convergence_cutoff]
      advanced_workflows: [convergence_kpoint, muon_relaxation, uep]

  - name: SPIN_POLARIZED
    canonical_name: spin_polarized
    file: param
    kind: scalar
    value_type: bool
    unit:
    allowed_values: [TRUE, FALSE]
    mutually_exclusive_with: [SPIN_POLARISED]
    requires: []
    example: SPIN_POLARIZED : TRUE
    notes: American spelling.
    gui:
      label: Spin Polarized
      category: electronic
      widget_hint: checkbox
      default_value: false
      advanced_workflows: [convergence_cutoff, convergence_kpoint, pristine_relaxation, uep, muon_generation, muon_relaxation, site_analysis, magnetic_field, quantum_corrections, energy_barriers]

  - name: SPIN_POLARISED
    canonical_name: spin_polarised
    file: param
    kind: scalar
    value_type: bool
    unit:
    allowed_values: [TRUE, FALSE]
    mutually_exclusive_with: [SPIN_POLARIZED]
    requires: []
    example: SPIN_POLARISED : TRUE
    notes: English spelling.

  - name: SPIN
    canonical_name: spin
    file: param
    kind: scalar
    value_type: number
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: SPIN : 2
    notes: Net spin of the whole cell, in units of hbar/2. MuFinder sets spins per atom with inline `SPIN=<value>` tokens on `POSITIONS_FRAC` rows, from which CASTEP derives the net spin, and CASTEP stops with an error when an explicit `SPIN` disagrees with their sum. It is therefore not offered in any workflow's parameter dialog from the starter catalog; with a local `castep_keywords.json` it can still be added like any other CASTEP keyword.
    gui:
      label: Initial Spin
      category: electronic
      widget_hint: spinbox_float
      default_value: 0.0
      advanced_workflows: []

  - name: SMEARING_WIDTH
    canonical_name: smearing_width
    file: param
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: eV
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: SMEARING_WIDTH : 0.1 eV
    notes: MuFinder checks only that the value is a single positive number.
    gui:
      label: Smearing Width
      category: scf
      widget_hint: unit_float
      default_value: 0.1
      advanced_workflows: [convergence_cutoff, convergence_kpoint, muon_relaxation]

  - name: MAX_SCF_CYCLES
    canonical_name: max_scf_cycles
    file: param
    kind: scalar
    value_type: positive_int
    unit:
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: MAX_SCF_CYCLES : 60
    notes: Integer greater than zero.
    gui:
      label: Max SCF Cycles
      category: scf
      widget_hint: spinbox_int
      default_value: 100
      basic_workflows: [convergence_cutoff, convergence_kpoint, muon_relaxation]

  - name: ELEC_ENERGY_TOL
    canonical_name: elec_energy_tol
    file: param
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: eV
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: ELEC_ENERGY_TOL : 1e-6 eV
    notes: A unit given with the value is kept in the written input.
    gui:
      label: SCF Energy Tolerance
      category: scf
      widget_hint: unit_float
      default_value: 1.0e-6
      basic_workflows: [convergence_cutoff, convergence_kpoint, muon_relaxation]

  - name: NONSCF_EIGENVALUE_TOL
    canonical_name: nonscf_eigenvalue_tol
    file: param
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: eV
    allowed_values: []
    mutually_exclusive_with: []
    requires: []
    example: NONSCF_EIGENVALUE_TOL : 1e-9 eV
    notes: Response-property diagonalization tolerance used by workflows such as phonons.
    gui:
      label: Response Eigenvalue Tolerance
      category: scf
      widget_hint: unit_float
      default_value: 1.0e-9
      advanced_workflows: [quantum_corrections]

  - name: GEOM_ENERGY_TOL
    canonical_name: geom_energy_tol
    file: param
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: eV
    allowed_values: []
    mutually_exclusive_with: []
    requires: [TASK=GEOMETRYOPTIMIZATION]
    example: GEOM_ENERGY_TOL : 2e-5 eV
    notes: Used only when TASK is GEOMETRYOPTIMIZATION.
    gui:
      label: Geometry Energy Tolerance
      category: geometry
      widget_hint: unit_float
      default_value: 2.0e-5
      advanced_workflows: [muon_relaxation]

  - name: GEOM_FORCE_TOL
    canonical_name: geom_force_tol
    file: param
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: eV/ang
    allowed_values: []
    mutually_exclusive_with: []
    requires: [TASK=GEOMETRYOPTIMIZATION]
    example: GEOM_FORCE_TOL : 0.05 eV/ang
    notes: Used only when TASK is GEOMETRYOPTIMIZATION.
    gui:
      label: Geometry Force Tolerance
      category: geometry
      widget_hint: unit_float
      default_value: 0.05
      advanced_workflows: [muon_relaxation]

  - name: GEOM_STRESS_TOL
    canonical_name: geom_stress_tol
    file: param
    kind: scalar
    value_type: positive_float_with_optional_unit
    unit: GPa
    allowed_values: []
    mutually_exclusive_with: []
    requires: [TASK=GEOMETRYOPTIMIZATION]
    example: GEOM_STRESS_TOL : 0.1 GPa
    notes: The unit is optional; a unit given with the value is kept in the written input.
    gui:
      label: Geometry Stress Tolerance
      category: geometry
      widget_hint: unit_float
      default_value: 0.1
      advanced_workflows: [muon_relaxation]

  - name: GEOM_MAX_ITER
    canonical_name: geom_max_iter
    file: param
    kind: scalar
    value_type: non_negative_int
    unit:
    allowed_values: []
    mutually_exclusive_with: []

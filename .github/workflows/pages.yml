name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # One runner renders every screenshot here; a whole run takes under ten
  # minutes. The limit stops a hang outside a scene, which the renderer's
  # --scene-timeout does not cover.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Prepare runtime directories
        run: |
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/xdg-cache"
          {
            echo "QT_QPA_PLATFORM=offscreen"
            echo "PYVISTA_OFF_SCREEN=true"
            echo "VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=1"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache"
          } >> "$GITHUB_ENV"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      # The screenshots run real field calculations, so the docs need the
      # scientific backends as well.
      - name: Install Python dependencies
        run: |
          uv sync --locked --extra dev --extra scientific-backends
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The screenshots are a pure function of the renderer, the application and
      # the real-output fixtures, so an unchanged tree reuses the images. A
      # restored archive keeps the .stamp mtime of the run that saved it, which
      # is older than this checkout, so a hit touches it: make then sees the
      # stamp as newer than the sources and skips the render.
      - name: Restore documentation screenshots
        id: screenshots-cache
        uses: actions/cache@v4
        with:
          path: docs/_generated/screenshots
          key: docs-screenshots-${{ runner.os }}-${{ hashFiles('scripts/docs_screenshots/**', 'scripts/render_docs_screenshots.py', 'src/mufinder/**', 'tests/fixtures/**', 'uv.lock') }}

      - name: Mark the restored screenshots current
        if: steps.screenshots-cache.outputs.cache-hit == 'true'
        run: touch docs/_generated/screenshots/.stamp

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # make docs renders the user-guide screenshots into
      # docs/_generated/screenshots before Sphinx builds the site.
      - name: Build documentation
        run: make docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub Pages keeps its own copy of a deployed site, so the uploaded
  # artifact is not needed once the deployment succeeds. Deleting it keeps
  # the site and its screenshots out of the Actions storage quota. A failed
  # deployment keeps its artifact, so the deploy job can be re-run; the
  # one-day retention removes it otherwise.
  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      actions: write
    steps:
      - name: Delete this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ARTIFACTS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          ARTIFACTS: repos/${{ github.repository }}/actions/artifacts
        run: |
          gh api --paginate "$RUN_ARTIFACTS" --jq '.artifacts[] | "\(.id) \(.name)"' |
            while read -r id name; do
              echo "Deleting artifact $name ($id)"
              gh api --method DELETE "$ARTIFACTS/$id"
            done

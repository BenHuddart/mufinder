name: Preview Build

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "develop"
        type: string

permissions:
  contents: read

env:
  APP_NAME: MuFinder
  BUILD_LABEL: preview-${{ github.run_number }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller Pillow

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            $nsisPath = Join-Path $env:ProgramFiles "NSIS"
          }
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "makensis.exe was not found after installing NSIS."
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Build Windows installer
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "dist\MuFinder-$env:BUILD_LABEL-windows-x64.exe"
          $iconFile = Join-Path $PWD "packaging\build\mufinder.ico"
          makensis /DAPP_NAME="$env:APP_NAME" /DAPP_VERSION="$env:BUILD_LABEL" /DAPP_DIR="$PWD\dist\MuFinder" /DOUTPUT_FILE="$installer" /DEXECUTABLE_NAME="MuFinder.exe" /DICON_FILE="$iconFile" packaging\windows\mufinder.nsi
          "WINDOWS_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-preview-installer
          path: ${{ env.WINDOWS_INSTALLER }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller dmgbuild Pillow

      - name: Build PyInstaller app bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Generate DMG background
        run: python scripts/build_dmg_background.py --output packaging/build/dmg-background.png

      - name: Build DMG
        env:
          MUFINDER_APP_BUNDLE: ${{ github.workspace }}/dist/MuFinder.app
          MUFINDER_DMG_BACKGROUND: ${{ github.workspace }}/packaging/build/dmg-background.png
        run: |
          mkdir -p dist
          dmgbuild -s packaging/macos/dmg_settings.py "$APP_NAME" "dist/MuFinder-$BUILD_LABEL-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-preview-dmg
          path: dist/MuFinder-${{ env.BUILD_LABEL }}-macos.dmg

name: Preview Build

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "develop"
        type: string

permissions:
  contents: read

env:
  APP_NAME: MuFinder
  BUILD_LABEL: preview-${{ github.run_number }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install git+https://github.com/bonfus/muLFC.git@v0.0.4
          python -m pip install ".[scientific-backends]"
          python -m pip install pyinstaller Pillow

      - name: Verify packaged runtime imports
        run: |
          python -c "import importlib; [importlib.import_module(name) for name in ['PySide6.QtCore', 'ase', 'paramiko', 'pyvista', 'pyvistaqt', 'vtkmodules', 'muesr', 'mulfc', 'soprano']]"

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Install WiX
        run: dotnet tool install --global wix --version 4.0.6

      - name: Add WiX UI extension
        run: wix extension add --global WixToolset.UI.wixext/4.0.6

      - name: Harvest PyInstaller bundle for WiX
        shell: pwsh
        run: |
          $appDir = "$env:GITHUB_WORKSPACE\dist\MuFinder"
          python scripts/generate_wix_fragment.py $appDir --output packaging\windows\AppFiles.wxs

      - name: Build MSI installer
        shell: pwsh
        run: |
          $msiVersion = "0.0.$($env:GITHUB_RUN_NUMBER)"
          $appDir = "$env:GITHUB_WORKSPACE\dist\MuFinder"
          $iconFile = "$env:GITHUB_WORKSPACE\packaging\build\mufinder.ico"
          $output = "dist\MuFinder-$env:BUILD_LABEL-windows-x64.msi"
          wix build packaging\windows\installer.wxs packaging\windows\AppFiles.wxs `
            -d Version=$msiVersion `
            -d AppDir=$appDir `
            -d IconFile=$iconFile `
            -o $output `
            -arch x64 `
            -ext WixToolset.UI.wixext

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-preview-installer
          path: dist/MuFinder-${{ env.BUILD_LABEL }}-windows-x64.msi
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install ".[scientific-backends]"
          python -m pip install pyinstaller dmgbuild Pillow

      - name: Verify packaged runtime imports
        run: |
          python -c "import importlib; [importlib.import_module(name) for name in ['PySide6.QtCore', 'ase', 'paramiko', 'pyvista', 'pyvistaqt', 'vtkmodules', 'muesr', 'mulfc', 'soprano']]"

      - name: Build PyInstaller app bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Generate DMG background
        run: python scripts/build_dmg_background.py --output packaging/build/dmg-background.png

      - name: Build DMG
        env:
          MUFINDER_APP_BUNDLE: ${{ github.workspace }}/dist/MuFinder.app
          MUFINDER_DMG_BACKGROUND: ${{ github.workspace }}/packaging/build/dmg-background.png
        run: |
          mkdir -p dist
          dmgbuild -s packaging/macos/dmg_settings.py "$APP_NAME" "dist/MuFinder-$BUILD_LABEL-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-preview-dmg
          path: dist/MuFinder-${{ env.BUILD_LABEL }}-macos.dmg
          retention-days: 7

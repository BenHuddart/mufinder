name: Release Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Tag to publish from (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: MuFinder

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: Resolve release metadata from tag
        id: meta
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "Release tag '$tag' must start with 'v'."; exit 1 ;;
          esac
          {
            echo "release_tag=$tag"
            echo "version=${tag#v}"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate tag version matches pyproject.toml
        run: |
          tag_version="${{ steps.meta.outputs.version }}"
          pyproject_version=$(python3 -c "
          import re, pathlib
          m = re.search(r'^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text(), re.MULTILINE)
          print(m.group(1) if m else '')
          ")
          if [ "$tag_version" != "$pyproject_version" ]; then
            echo "ERROR: tag version ($tag_version) does not match pyproject.toml version ($pyproject_version)"
            exit 1
          fi
          echo "Version check passed: $tag_version"

  build-windows:
    needs: resolve-release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install git+https://github.com/bonfus/muLFC.git@v0.0.4
          python -m pip install ".[scientific-backends]"
          python -m pip install pyinstaller Pillow

      - name: Verify packaged runtime imports
        run: |
          python -c "import importlib; [importlib.import_module(name) for name in ['PySide6.QtCore', 'ase', 'paramiko', 'pyvista', 'pyvistaqt', 'vtkmodules', 'muesr', 'mulfc', 'soprano']]"

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $appDir = "$env:GITHUB_WORKSPACE\dist\MuFinder"
          $iconFile = "$env:GITHUB_WORKSPACE\packaging\build\mufinder.ico"
          $outputDir = "$env:GITHUB_WORKSPACE\dist"
          iscc `
            "/DAppVersion=$version" `
            "/DAppDir=$appDir" `
            "/DIconFile=$iconFile" `
            "/DOutputDir=$outputDir" `
            packaging\windows\mufinder.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: dist/MuFinder-${{ env.RELEASE_TAG }}-windows-x64.exe

  build-macos:
    needs: resolve-release
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install ".[scientific-backends]"
          python -m pip install pyinstaller dmgbuild Pillow

      - name: Verify packaged runtime imports
        run: |
          python -c "import importlib; [importlib.import_module(name) for name in ['PySide6.QtCore', 'ase', 'paramiko', 'pyvista', 'pyvistaqt', 'vtkmodules', 'muesr', 'mulfc', 'soprano']]"

      - name: Build PyInstaller app bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Generate DMG background
        run: python scripts/build_dmg_background.py --output packaging/build/dmg-background.png

      - name: Build DMG
        env:
          MUFINDER_APP_BUNDLE: ${{ github.workspace }}/dist/MuFinder.app
          MUFINDER_DMG_BACKGROUND: ${{ github.workspace }}/packaging/build/dmg-background.png
        run: |
          mkdir -p dist
          dmgbuild -s packaging/macos/dmg_settings.py "$APP_NAME" "dist/MuFinder-$RELEASE_TAG-macos-arm64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-arm64-dmg
          path: dist/MuFinder-${{ env.RELEASE_TAG }}-macos-arm64.dmg

  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    needs:
      - resolve-release
      - build-windows
      - build-macos
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were produced."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes --title "$APP_NAME $RELEASE_TAG" --target "$SOURCE_SHA"
          fi

      - name: Delete uploaded build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_names=("windows-installer" "macos-arm64-dmg")

          for artifact_name in "${artifact_names[@]}"; do
            artifact_ids="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${artifact_name}\") | .id")"

            if [ -z "$artifact_ids" ]; then
              echo "No Actions artifact named ${artifact_name} found."
              continue
            fi

            while IFS= read -r artifact_id; do
              if [ -z "$artifact_id" ]; then
                continue
              fi

              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
              echo "Deleted Actions artifact ${artifact_name} (${artifact_id})."
            done <<< "$artifact_ids"
          done

name: Release Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Tag to publish from (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: MuFinder

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: Resolve release metadata from tag
        id: meta
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "Release tag '$tag' must start with 'v'."; exit 1 ;;
          esac
          {
            echo "release_tag=$tag"
            echo "version=${tag#v}"
            echo "source_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    needs: resolve-release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller Pillow

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            $nsisPath = Join-Path $env:ProgramFiles "NSIS"
          }
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "makensis.exe was not found after installing NSIS."
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Build Windows installer
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "dist\MuFinder-$env:RELEASE_TAG-windows-x64.exe"
          $iconFile = Join-Path $PWD "packaging\build\mufinder.ico"
          makensis /DAPP_NAME="$env:APP_NAME" /DAPP_VERSION="$env:RELEASE_TAG" /DAPP_DIR="$PWD\dist\MuFinder" /DOUTPUT_FILE="$installer" /DEXECUTABLE_NAME="MuFinder.exe" /DICON_FILE="$iconFile" packaging\windows\mufinder.nsi
          "WINDOWS_INSTALLER=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: ${{ env.WINDOWS_INSTALLER }}

  build-macos:
    needs: resolve-release
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller dmgbuild Pillow

      - name: Build PyInstaller app bundle
        run: pyinstaller --noconfirm packaging/pyinstaller/mufinder.spec

      - name: Generate DMG background
        run: python scripts/build_dmg_background.py --output packaging/build/dmg-background.png

      - name: Build DMG
        env:
          MUFINDER_APP_BUNDLE: ${{ github.workspace }}/dist/MuFinder.app
          MUFINDER_DMG_BACKGROUND: ${{ github.workspace }}/packaging/build/dmg-background.png
        run: |
          mkdir -p dist
          dmgbuild -s packaging/macos/dmg_settings.py "$APP_NAME" "dist/MuFinder-$RELEASE_TAG-macos.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: dist/MuFinder-${{ env.RELEASE_TAG }}-macos.dmg

  publish:
    runs-on: ubuntu-latest
    needs:
      - resolve-release
      - build-windows
      - build-macos
    env:
      RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.resolve-release.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.source_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release artifacts were produced."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --generate-notes --title "$APP_NAME $RELEASE_TAG" --target "$SOURCE_SHA"
          fi

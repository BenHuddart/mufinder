name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare runtime directories
        run: |
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/xdg-cache"
          {
            echo "QT_QPA_PLATFORM=offscreen"
            echo "PYVISTA_OFF_SCREEN=true"
            echo "VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=1"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache"
          } >> "$GITHUB_ENV"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e ".[dev,scientific-backends]"

      - name: Run full test suite
        run: python -m pytest -n auto --dist load

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare runtime directories
        run: |
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/xdg-cache"
          {
            echo "QT_QPA_PLATFORM=offscreen"
            echo "PYVISTA_OFF_SCREEN=true"
            echo "VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=1"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache"
          } >> "$GITHUB_ENV"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build Sphinx documentation
        run: python -m sphinx -W -b html docs docs/_build/html

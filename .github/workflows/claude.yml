name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # The agent has a bounded execution window. Fail loudly if it is exhausted
    # rather than silently ending mid-run with the work uncommitted.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Prepare runtime directories
        run: |
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/xdg-cache"
          {
            echo "QT_QPA_PLATFORM=offscreen"
            echo "PYVISTA_OFF_SCREEN=true"
            echo "VTK_DEFAULT_RENDER_WINDOW_OFFSCREEN=1"
            echo "LIBGL_ALWAYS_SOFTWARE=1"
            echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg-cache"
          } >> "$GITHUB_ENV"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0

      # Install the dev environment as a static step (mirroring ci.yml) so the
      # agent starts with a ready venv instead of spending its execution window
      # on a cold pip install. Extras match the CI test job exactly.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install -e ".[dev,scientific-backends]"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(python*),Bash(git*),Bash(pip*),Bash(gh*)"
            --system-prompt "You are working on MuFinder. Read AGENTS.md at the repository root before making changes and follow it; it is the canonical guide (layers, shared homes, CASTEP, tests, docs, branch and PR rules). This job is time-bounded, so work in this order so nothing is lost: (1) make the code, test and doc changes; (2) immediately commit, push a feature branch and open or update a PR; (3) only then verify, using focused no-coverage runs of the tests for the area you touched, for example `python -m pytest --no-cov tests/app/test_kpoint_convergence_widget.py`. Do not run the full quality gates here: the PR's CI is the authoritative gate and runs the full suite, the coverage threshold and the Sphinx build on every push; if it fails, push a follow-up commit to the same branch. The dev environment is already installed in this job; do not reinstall it."
